<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Leaning on Every Earlier Case: an animated explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141230; --stage:#201C4D; --card:#2A2560; --ink:#F3F1FF; --muted:#A7A2DD; --line:#3E3880;
    --paper:#FFE08A; --tink:#26215E; --pop:#FF5C80; --mint:#34D399; --sky:#6EA2FF; --sun:#FFC94D; --grape:#A784FF;
    --on-strong:#1B1846; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141230; --stage:#201C4D; --card:#2A2560; --ink:#F3F1FF; --muted:#A7A2DD; --line:#3E3880;
  --paper:#FFE08A; --tink:#26215E; --pop:#FF5C80; --mint:#34D399; --sky:#6EA2FF; --sun:#FFC94D; --grape:#A784FF;
  --on-strong:#1B1846; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}

</head>

    <h1>Lecture 30, animated</h1>
    <p>Recursive sequences, strong induction, and well-ordering for CS 341.</p>
  </header>
  <section class="player" id="player" aria-label="Animated explainer player">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1600 900" role="img" aria-label="Animation stage. The captions below describe each scene."></svg>
      <button class="poster" id="poster" type="button" aria-label="Play the explainer">
        <span class="poster-len" id="posterLen"></span>
        <span class="poster-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5v15l13-7.5z" fill="currentColor"/></svg></span>
      </button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="controls">
      <button class="btn play" id="play" type="button" aria-label="Play"></button>
      <button class="btn" id="restart" type="button" aria-label="Restart from the beginning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M3.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="scrub"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="100" step="0.1" value="0" aria-label="Seek"></div>
      <span class="time" id="time" aria-live="off">0:00</span>
      <button class="btn" id="speed" type="button" aria-label="Playback speed">1×</button>
      <button class="btn" id="cc" type="button" aria-pressed="true" aria-label="Captions">CC</button>
      <button class="btn" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  </section>
  <p class="hint">Space plays or pauses. The left and right arrow keys skip 5 seconds. Tap any chapter to jump there.</p>
  <p class="hint rotate">Turn your phone sideways for a bigger picture.</p>
</main>

const sceneAt=t=>{let i=0;for(let k=0;k<starts.length;k++)if(t>=starts[k])i=k;return i;};
function render(){
  const t=started?T:9.6;
  const i=sceneAt(Math.min(t,TOTAL-1e-6));
  if(i!==lastScene){scenes.forEach((s,k)=>s.g.style.display=k===i?'':'none');lastScene=i;}
  if(scenes[i]._lv!==FONTV){scenes[i].rows.forEach(layoutRow);scenes[i]._lv=FONTV;}
  scenes[i].update(t-starts[i]);
  renderWipe(t);
  let c='';if(started){for(const [ct,s] of caps){if(ct<=T)c=s;else break;}}
  if(c!==lastCap){capEl.textContent=c;lastCap=c;}
  scrub.value=T;scrub.style.setProperty('--pct',(T/TOTAL*100).toFixed(2)+'%');
  timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
  let ch=0;chapters.forEach((cc,k)=>{if(T>=cc.t-.001)ch=k;});
  if(ch!==lastChap){chapters.forEach((cc,k)=>cc.btn.setAttribute('aria-current',k===ch?'true':'false'));
    if(started){const b=chapters[ch].btn;chapNav.scrollTo({left:b.offsetLeft-chapNav.clientWidth/2+b.offsetWidth/2,behavior:RM?'auto':'smooth'});}lastChap=ch;}
}
function setPlaying(p){
  if(p&&T>=TOTAL-.01)T=0;
  playing=p;last=null;
  if(p){started=true;poster.hidden=true;}
  const ended=!p&&T>=TOTAL-.01;
  playBtn.innerHTML=p?ICON.pause:(ended?ICON.replay:ICON.play);
  playBtn.setAttribute('aria-label',p?'Pause':(ended?'Replay':'Play'));
  dirty=true;
}
function seek(t){started=true;poster.hidden=true;T=clamp(t,0,TOTAL);dirty=true;}
function loop(now){
  if(playing){if(last!==null)T+=Math.min((now-last)/1000,.1)*speed;last=now;if(T>=TOTAL){T=TOTAL;setPlaying(false);}dirty=true;}
  if(dirty){render();dirty=false;}
  requestAnimationFrame(loop);
}
playBtn.addEventListener('click',()=>setPlaying(!playing));
poster.addEventListener('click',()=>{T=0;setPlaying(true);playBtn.focus({preventScroll:true});});
$('restart').addEventListener('click',()=>{seek(0);setPlaying(true);});
scrub.addEventListener('input',()=>seek(parseFloat(scrub.value)));
const speeds=[1,1.25,1.5,.75];
$('speed').addEventListener('click',e=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];e.currentTarget.textContent=speed+'×';e.currentTarget.setAttribute('aria-label','Playback speed '+speed+' times');});
$('cc').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);capEl.hidden=!on;});
const fsBtn=$('fs');
if(!(document.fullscreenEnabled&&player.requestFullscreen))fsBtn.hidden=true;
fsBtn.addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else player.requestFullscreen().catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key===' '||e.key==='k'){if(tag==='button'&&e.key===' ')return;if(tag==='input'&&e.key===' '){e.preventDefault();setPlaying(!playing);return;}
    if(tag!=='input'){e.preventDefault();setPlaying(!playing);}}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&tag!=='input'){e.preventDefault();seek(T+(e.key==='ArrowRight'?5:-5));}
});
setPlaying(false);
if(document.fonts){if(document.fonts.ready)document.fonts.ready.then(()=>{FONTV++;dirty=true;});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{FONTV++;dirty=true;});}
window.__seek=t=>{seek(t);render();};
window.__total=TOTAL;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
