    bStep=el('path',{d:`M${X(2)-30} 560 V578 H${X(9)+30} V560`,fill:'none',stroke:'--sky','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},r);
    bStepL=G(r,(X(2)+X(9))/2,610);pill(bStepL,460,48,'--sky','the inductive step works for k ≥ 3',{size:26,color:'--on-strong'});
    bTrue=el('path',{d:`M${X(4)-30} 660 V678 H${X(9)+30} V660`,fill:'none',stroke:'--mint','stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},r);
    bTrueL=G(r,(X(4)+X(9))/2,712);pill(bTrueL,380,48,'--mint','the claim is true from 5 on',{size:26});
    lone=G(r,X(0)+20,250);pill(lone,330,48,'--card','true at 1, but the chain breaks at 2',{size:22,color:'--ink'});
    bottom=G(r,800,800);pill(bottom,1160,66,'--grape','The base step decides where the result begins. Test small values first.',{size:29,color:'--on-strong'});
  },
  update(t){
    place(head,{o:P(t,.4,1)});
    dom.forEach((g,i)=>{const v=pv(t,.8+i*.08);const sh=TRUTH[i]===0&&t>5.2&&t<6.2&&!RM?Math.sin((t-5.2)*30)*4:0;place(g,{s:v.s,o:v.o,r:(i>=4?fallAng(t,9.6+(i-4)*.26):0)+sh});place(labs[i],{o:P(t,1.2+i*.08,1.6+i*.08)});});
    badges.forEach((g,i)=>show(g,t,2+i*.1));
    bStep.setAttribute('opacity',P(t,1.8,2.2));show(bStepL,t,2.2);bTrue.setAttribute('opacity',P(t,6.4,6.8));show(bTrueL,t,6.8);
    show(lone,t,7.4);show(bottom,t,13.6);

})());

/* 8. Divisibility */
scenes.push((()=>{
  let claim,tab,tcols=[],L1,L2,ih,T=[],kTag,nest,ninner,concl,trick;
  const CX=n=>620+180*(n-1),V=[3,15,63,255];
  return {title:'Divisibility',dur:32,chapters:[[0,'Divisibility'],[16,'The trick']],
  caps:[[0.6,'Divisibility. Claim: for every positive integer n, 3 divides 4ⁿ − 1.'],[3.6,'Look first: 3, 15, 63, 255. All multiples of 3.'],[8,'Base step: 4¹ − 1 = 3, which 3 divides.'],[11.4,'Inductive step: assume 3 divides 4ᵏ − 1, so 4ᵏ − 1 = 3m for some integer m.'],[16.4,'Now look at 4ᵏ⁺¹ − 1 = 4 · 4ᵏ − 1. We want 4ᵏ − 1 to show up.'],[20.6,'So subtract 4 and add it back: 4(4ᵏ − 1) + 3. There’s the k case!'],[25,'Substitute: 4(3m) + 3 = 3(4m + 1). Divisible by 3.'],[28.6,'The trick: find where the k case lives inside the k + 1 case.']],
  build(r){
    claim=thmTicket(r,140,1000,'Claim',['For every positive integer n,  3 divides 4',SUP('n'),' − 1.']);
    tab=G(r,0,0);
    const lab=(y,pc)=>row(tab,330,y,pc,{size:34,weight:700,anchor:'middle'});
    lab(260,['n']);lab(330,['4',SUP('n'),' − 1']);lab(400,['= 3 ×']);
    for(let n=1;n<=4;n++){const g=G(tab,0,0);txt(g,CX(n),260,String(n),{size:34,weight:700,fill:'--muted'});txt(g,CX(n),330,String(V[n-1]),{size:36,weight:600});txt(g,CX(n),400,String(V[n-1]/3),{size:36,weight:700,fill:'--mint'});tcols.push(g);}
    L1=row(r,200,500,['Base:  4',SUP('1'),' − 1 = 3,  divisible by 3  ',['✓',{fill:'--mint',weight:700}]],{size:36});
    L2=row(r,200,580,['Assume  ',['3 | 4',{box:'--sun',span:3,weight:700}],SUP('k',{inbox:1,weight:700}),[' − 1',{inbox:1,weight:700,padR:1}],',  so  4',SUP('k'),' − 1 = 3m'],{size:36});
    ih=G(r,0,580);pill(ih,260,42,'--sun','inductive hypothesis',{size:22});
    T.push(row(r,200,340,['4',SUP('k+1'),' − 1 ','= 4 · 4',SUP('k'),' − 1'],{size:38}));
    T.push(row(r,0,420,['= 4 · 4',SUP('k'),['− 4 + 4',{box:'--sun',weight:700}],' − 1'],{size:38}));
    T.push(row(r,0,500,['= 4',['(4',{box:'--sky',span:3,fill:'--on-strong',weight:700}],SUP('k',{fill:'--on-strong',weight:700}),[' − 1)',{fill:'--on-strong',weight:700,padR:1}],' + 3'],{size:38}));
    T.push(row(r,0,580,['= 4(3m) + 3 = 3(4m + 1)  ',['✓',{fill:'--mint',weight:700}]],{size:38}));
    kTag=G(r,0,500);pill(kTag,180,44,'--sky','the k case!',{size:24,color:'--on-strong'});
    nest=G(r,1330,470);el('rect',{x:-150,y:-130,width:300,height:260,rx:26,fill:'--card',stroke:'--mint','stroke-width':6},nest);txt(nest,0,-96,'the k + 1 case',{size:28,weight:700});
    ninner=G(nest,0,24);el('rect',{x:-100,y:-60,width:200,height:120,rx:20,fill:'--sky'},ninner);txt(ninner,0,0,'the k case',{size:28,weight:700,fill:'--on-strong'});
    concl=G(r,800,690);pill(concl,920,66,'--mint','4m + 1 is an integer, so 3 divides 4ᵏ⁺¹ − 1.  ∎',{size:30});
    trick=G(r,800,790);pill(trick,1040,70,'--grape','Find where the k case lives inside the k + 1 case',{size:32,color:'--on-strong'});
  },
  update(t){
    show(claim,t,.5);
    place(tab,{o:P(t,3.4,3.8)*(1-P(t,15.6,16))});tcols.forEach((g,i)=>place(g,{o:P(t,3.8+i*.4,4.2+i*.4)}));
    slideIn(L1,t,8.2);place(L1,{o:P(t,8.2,8.7)*(1-P(t,15.6,16))});
    const up=P(t,16,16.6,eio);const k2=P(t,11.6,12.1,eout);place(L2,{dx:-(1-k2)*40,o:k2,dy:-up*330});
    ih._x=200+L2._w+150;ih._y=580;show(ih,t,12.4,1e9,{dy:-up*330});
    const ex=T[0]._pc[3].x;for(let i=1;i<4;i++)if(Math.abs(T[i]._ax-ex)>.5){T[i]._ax=ex;layoutRow(T[i]);}
    [16.6,20.8,22.6,25.2].forEach((a,i)=>slideIn(T[i],t,a));
    kTag._x=T[2]._x0+T[2]._w+110;show(kTag,t,23.2);
    show(nest,t,22.8);show(ninner,t,23.6);show(concl,t,26.6);show(trick,t,28.8);
  }};
})());

/* 9. Takeaways */
scenes.push((()=>{
  let head,tk=[];
  const L=['Start the chain where the claim becomes true.','Inequalities: one side, the IH, justify every link.','Find the k case inside the k + 1 case.'];
  const A=[.6,5.6,10.6];
  return {title:'Takeaways',dur:16,
  caps:[[0.6,'Test small values, then put the base step where the claim actually starts.'],[5.6,'For inequalities, start from one side, bring in the hypothesis, and justify every link.'],[10.6,'For sums and divisibility, find where the k case lives inside the k + 1 case.']],
  build(r){
    head=gt(r,800,95,'Three things to remember',{size:60,weight:600});
    L.forEach((s,i)=>{const g=G(r,800,265+190*i);ticket(g,1180,150);
      el('line',{x1:-410,y1:-58,x2:-410,y2:58,stroke:'--tink','stroke-width':4,'stroke-dasharray':'6 10','stroke-linecap':'round',opacity:.45},g);
      const ic=G(g,-500,0);
      if(i===0){pill(G(ic,0,0),70,40,'--sun','m',{size:26});}
      else if(i===1){el('ellipse',{cx:-14,cy:0,rx:22,ry:13,fill:'none',stroke:'--tink','stroke-width':6},ic);el('ellipse',{cx:14,cy:0,rx:22,ry:13,fill:'none',stroke:'--tink','stroke-width':6},ic);}
      else{el('rect',{x:-36,y:-30,width:72,height:60,rx:10,fill:'none',stroke:'--tink','stroke-width':5},ic);el('rect',{x:-18,y:-14,width:36,height:28,rx:6,fill:'--sky'},ic);}
      txt(g,-372,0,s,{size:37,weight:600,fill:'--tink',anchor:'start'});tk.push(g);});

  };
})());

/* 10. Exit ticket */
scenes.push((()=>{
  let head,cards=[],backs=[],ans=[],timer,arc,cnt,foot;
  const C=2*Math.PI*40;
  const Q=[{q:'Q1',lines:[['For the claim  3ⁿ ≥ 2n + 1',34,700],['for all n ≥ 1,',32,600],['what is the base step?',32,600]],a:[['n = 1:  3 ≥ 2 · 1 + 1 = 3  ✓',32,700],['(equality is fine: the claim says ≥)',24,500]]},
           {q:'Q2',lines:[['In the proof that 2ⁿ > n²,',34,600],['why is the base step 5,',34,600],['and not 1?',34,600]],a:[['The claim is false at n = 2, 3, 4,',28,700],['so a chain from 1 breaks at once.',28,700],['It’s true from 5 on.',26,500]]}];
  return {title:'Exit ticket',dur:18,
  caps:[[0.6,'Exit ticket: try both in your head before the reveal.'],[8,'Check yourself!'],[10.6,'Q1: at n = 1, both sides are 3, and the claim allows equality. Q2: the claim fails at 2, 3, and 4.'],[14.6,'Next up: Sections 4.3 and 4.4, sequences and the strong principle.']],
  build(r){
    head=gt(r,800,95,'Exit ticket',{size:60,weight:600});
    Q.forEach((d,i)=>{const g=G(r,i?1170:430,445);
      el('rect',{x:-345,y:-235,width:690,height:470,rx:30,fill:'--card',stroke:'--line','stroke-width':3},g);
      pill(G(g,-275,-185),84,52,'--pop',d.q,{size:28,color:'--on-strong',weight:700});
      d.lines.forEach(([s,sz,w],j)=>txt(g,0,-140+46*j,s,{size:sz,weight:w}));
      const b=G(g,0,108);el('rect',{x:-315,y:-100,width:630,height:200,rx:26,fill:'--line'},b);txt(b,0,0,'Think first…',{size:34,weight:600,fill:'--muted'});backs.push(b);
      const a=G(g,0,108);el('rect',{x:-315,y:-100,width:630,height:200,rx:26,fill:'--stage',stroke:'--mint','stroke-width':5},a);
      const k=d.a.length,step=50,y0=-(k-1)*step/2;d.a.forEach(([s,sz,w],j)=>txt(a,0,y0+step*j,s,{size:sz,weight:w,fill:j===k-1&&w<700?'--muted':'--ink'}));ans.push(a);cards.push(g);});
    timer=G(r,800,800);el('circle',{r:40,fill:'none',stroke:'--line','stroke-width':10},timer);
    arc=el('circle',{r:40,fill:'none',stroke:'--sun','stroke-width':10,'stroke-linecap':'round','stroke-dasharray':C.toFixed(1),transform:'rotate(-90)'},timer);
    cnt=txt(timer,0,0,'5',{size:34,weight:700});
    foot=gt(r,800,800,'Next up: Sections 4.3 and 4.4, Sequences and the Strong Principle',{size:32,weight:500,fill:'--muted'});
  },
  update(t){
    place(head,{o:P(t,.4,1)});
    cards.forEach((g,i)=>show(g,t,.6+i*.3));
    [8,8.6].forEach((a,i)=>{const k=P(t,a,a+.6),sy=Math.max(Math.abs(Math.cos(k*Math.PI)),.03);
      place(backs[i],{sx:1,sy,o:k<.5?1:0});place(ans[i],{sx:1,sy,o:k>=.5?1:0});});
    const tk=P(t,.9,7.6,x=>x);arc.setAttribute('stroke-dashoffset',(C*tk).toFixed(1));
    const n=String(Math.max(1,5-Math.floor(tk*5)));if(cnt.textContent!==n)cnt.textContent=n;
    place(timer,{o:Math.min(P(t,.9,1.3),1-P(t,7.6,8.1))});
    place(foot,{o:P(t,14.6,15.2)});
  }};
})());

/* ---------- assemble timeline ---------- */
const root=el('g',{},svg);
const starts=[];let acc=0;
scenes.forEach(s=>{starts.push(acc);s.g=el('g',{},root);s.rows=[];BUILDING=s;s.build(s.g);BUILDING=null;s._lv=-1;s.g.style.display='none';acc+=s.dur;});
const TOTAL=acc;
const chapters=[];scenes.forEach((s,i)=>(s.chapters||[[0,s.title]]).forEach(([o,ti])=>chapters.push({t:starts[i]+o,title:ti})));
const caps=[];scenes.forEach((s,i)=>s.caps.forEach(([o,c])=>caps.push([starts[i]+o,c])));

/* ticket-wipe transition between scenes, carrying the next chapter's title */
const wipe=el('g',{},svg);wipe._x=0;wipe._y=0;
el('path',{d:'M0 0 H2000 L1800 900 H-200Z',fill:'--sun'},wipe);
el('line',{x1:46,y1:0,x2:-154,y2:900,stroke:'--stage','stroke-width':8,'stroke-dasharray':'2 22','stroke-linecap':'round'},wipe);
el('line',{x1:1954,y1:0,x2:1754,y2:900,stroke:'--stage','stroke-width':8,'stroke-dasharray':'2 22','stroke-linecap':'round'},wipe);
const wNum=txt(wipe,900,372,'',{size:34,weight:600,fill:'--tink'});
const wTitle=txt(wipe,900,456,'',{size:92,weight:700,fill:'--tink'});
function renderWipe(t){
  let b=null;for(let i=1;i<starts.length;i++)if(Math.abs(t-starts[i])<.6){b=starts[i];break;}
  if(b===null){place(wipe,{o:0});return;}
  const u=(t-(b-.6))/1.2;
  const ci=chapters.findIndex(c=>Math.abs(c.t-b)<.01);
  if(ci>=0&&wTitle.textContent!==chapters[ci].title){wTitle.textContent=chapters[ci].title;wNum.textContent='Part '+(ci+1)+' of '+chapters.length;}
  if(RM){place(wipe,{dx:-100,o:clamp((.5-Math.abs(u-.5))*4)});return;}
  const tx=u<.4?lerp(1800,0,eout(u/.4)):u<.6?lerp(0,-200,(u-.4)/.2):lerp(-200,-2000,ein((u-.6)/.4));
  place(wipe,{dx:tx,o:1});
}

/* ---------- player ---------- */
const $=id=>document.getElementById(id);
const capEl=$('caption'),playBtn=$('play'),scrub=$('scrub'),timeEl=$('time'),poster=$('poster'),chapNav=$('chapters'),player=$('player');
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
scrub.max=TOTAL;
$('posterLen').textContent=Math.floor(TOTAL/60)+' min '+Math.round(TOTAL%60)+' s';
poster.setAttribute('aria-label','Play the explainer ('+Math.floor(TOTAL/60)+' minutes '+Math.round(TOTAL%60)+' seconds)');
const ICON={play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5v15l12.5-7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/></svg>',
  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M3.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const ticksEl=$('ticks');
chapters.forEach((c,i)=>{if(i){const s=document.createElement('span');s.style.left=(c.t/TOTAL*100)+'%';ticksEl.appendChild(s);}
  const b=document.createElement('button');b.type='button';b.className='chip';b.innerHTML='<b>'+(i+1)+'</b>';b.appendChild(document.createTextNode(c.title));
  b.addEventListener('click',()=>{seek(c.t+.01);setPlaying(true);});c.btn=b;chapNav.appendChild(b);});

let T=0,playing=false,started=false,speed=1,last=null,dirty=true,lastScene=-1,lastCap=null,lastChap=-1;
const sceneAt=t=>{let i=0;for(let k=0;k<starts.length;k++)if(t>=starts[k])i=k;return i;};
function render(){
  const t=started?T:12.4;
  const i=sceneAt(Math.min(t,TOTAL-1e-6));
  if(i!==lastScene){scenes.forEach((s,k)=>s.g.style.display=k===i?'':'none');lastScene=i;}
  if(scenes[i]._lv!==FONTV){scenes[i].rows.forEach(layoutRow);scenes[i]._lv=FONTV;}
  scenes[i].update(t-starts[i]);
  renderWipe(t);
  let c='';if(started){for(const [ct,s] of caps){if(ct<=T)c=s;else break;}}
  if(c!==lastCap){capEl.textContent=c;lastCap=c;}
  scrub.value=T;scrub.style.setProperty('--pct',(T/TOTAL*100).toFixed(2)+'%');
  timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
  let ch=0;chapters.forEach((cc,k)=>{if(T>=cc.t-.001)ch=k;});
  if(ch!==lastChap){chapters.forEach((cc,k)=>cc.btn.setAttribute('aria-current',k===ch?'true':'false'));
    if(started){const b=chapters[ch].btn;chapNav.scrollTo({left:b.offsetLeft-chapNav.clientWidth/2+b.offsetWidth/2,behavior:RM?'auto':'smooth'});}lastChap=ch;}
}
function setPlaying(p){
  if(p&&T>=TOTAL-.01)T=0;
  playing=p;last=null;
  if(p){started=true;poster.hidden=true;}
  const ended=!p&&T>=TOTAL-.01;
  playBtn.innerHTML=p?ICON.pause:(ended?ICON.replay:ICON.play);
  playBtn.setAttribute('aria-label',p?'Pause':(ended?'Replay':'Play'));
  dirty=true;
}
function seek(t){started=true;poster.hidden=true;T=clamp(t,0,TOTAL);dirty=true;}
function loop(now){
  if(playing){if(last!==null)T+=Math.min((now-last)/1000,.1)*speed;last=now;if(T>=TOTAL){T=TOTAL;setPlaying(false);}dirty=true;}
  if(dirty){render();dirty=false;}
  requestAnimationFrame(loop);
}
playBtn.addEventListener('click',()=>setPlaying(!playing));
poster.addEventListener('click',()=>{T=0;setPlaying(true);playBtn.focus({preventScroll:true});});
$('restart').addEventListener('click',()=>{seek(0);setPlaying(true);});
scrub.addEventListener('input',()=>seek(parseFloat(scrub.value)));
const speeds=[1,1.25,1.5,.75];
$('speed').addEventListener('click',e=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];e.currentTarget.textContent=speed+'×';e.currentTarget.setAttribute('aria-label','Playback speed '+speed+' times');});
$('cc').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);capEl.hidden=!on;});
const fsBtn=$('fs');
if(!(document.fullscreenEnabled&&player.requestFullscreen))fsBtn.hidden=true;
fsBtn.addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else player.requestFullscreen().catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key===' '||e.key==='k'){if(tag==='button'&&e.key===' ')return;if(tag==='input'&&e.key===' '){e.preventDefault();setPlaying(!playing);return;}
    if(tag!=='input'){e.preventDefault();setPlaying(!playing);}}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&tag!=='input'){e.preventDefault();seek(T+(e.key==='ArrowRight'?5:-5));}
});
setPlaying(false);
if(document.fonts){if(document.fonts.ready)document.fonts.ready.then(()=>{FONTV++;dirty=true;});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{FONTV++;dirty=true;});}
window.__seek=t=>{seek(t);render();};
window.__total=TOTAL;
requestAnimationFrame(loop);
})();
</script>
