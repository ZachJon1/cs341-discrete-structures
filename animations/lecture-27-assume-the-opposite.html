    if(tag!=='input'){e.preventDefault();setPlaying(!playing);}}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&tag!=='input'){e.preventDefault();seek(T+(e.key==='ArrowRight'?5:-5));}
});
setPlaying(false);
if(document.fonts){if(document.fonts.ready)document.fonts.ready.then(()=>{FONTV++;dirty=true;});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{FONTV++;dirty=true;});}
window.__seek=t=>{seek(t);render();};
window.__total=TOTAL;
requestAnimationFrame(loop);
})();
