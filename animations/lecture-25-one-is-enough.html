<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Is Enough: an animated explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{

  --on-strong:#FFFFFF;
  --display:"Fredoka","Nunito","Trebuchet MS","Segoe UI",system-ui,"Cambria Math","STIX Two Math",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,"Cambria Math",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141230; --stage:#201C4D; --card:#2A2560; --ink:#F3F1FF; --muted:#A7A2DD; --line:#3E3880;
    --paper:#FFE08A; --tink:#26215E; --pop:#FF5C80; --mint:#34D399; --sky:#6EA2FF; --sun:#FFC94D; --grape:#A784FF;
    --on-strong:#1B1846; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141230; --stage:#201C4D; --card:#2A2560; --ink:#F3F1FF; --muted:#A7A2DD; --line:#3E3880;
  --paper:#FFE08A; --tink:#26215E; --pop:#FF5C80; --mint:#34D399; --sky:#6EA2FF; --sun:#FFC94D; --grape:#A784FF;
  --on-strong:#1B1846; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 36px}
.intro{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin:4px 4px 14px}
.intro h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,3.6vw,40px);margin:0;letter-spacing:-0.01em}
.intro p{margin:0;color:var(--muted);font-size:17px;line-height:1.4}
.player{background:var(--card);border-radius:24px;padding:10px;border:2px solid var(--line)}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--stage);aspect-ratio:16/9;width:100%}
.stage svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.td{font-family:var(--display)}
.tb{font-family:var(--body)}
.poster{position:absolute;inset:0;border:0;padding:0;margin:0;background:transparent;cursor:pointer;color:inherit;font:inherit}
.poster[hidden]{display:none}
.poster-btn{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:clamp(56px,10vw,104px);aspect-ratio:1;border-radius:50%;
  background:var(--ink);color:var(--stage);display:grid;place-items:center;box-shadow:0 0 0 clamp(5px,.9vw,10px) var(--stage);transition:transform .18s ease}
.poster-btn svg{width:42%;height:42%;margin-left:8%}
.poster:hover .poster-btn,.poster:focus-visible .poster-btn{transform:translate(-50%,-50%) scale(1.07)}
.poster:focus-visible{outline:4px solid var(--sky);outline-offset:-4px;border-radius:16px}
.poster-len{position:absolute;left:14px;top:12px;background:var(--paper);color:var(--tink);font-weight:700;font-size:clamp(12px,1.5vw,15px);padding:5px 12px;border-radius:999px}
.caption{min-height:3.3em;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 18px 6px;

.caption:empty::before{content:"Captions appear here once you press play.";color:var(--muted);font-weight:400}
.caption[hidden]{display:none}
.controls{display:flex;align-items:center;gap:8px;padding:6px 4px 2px;flex-wrap:wrap}
.btn{min-width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--stage);color:var(--ink);

.btn svg{width:22px;height:22px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.play{background:var(--pop);border-color:var(--pop);color:var(--on-strong);min-width:52px}
.btn[aria-pressed="false"]{color:var(--muted)}
.scrub{position:relative;flex:1 1 220px;min-width:160px;height:44px;display:flex;align-items:center}
.ticks{position:absolute;left:11px;right:11px;top:6px;height:6px;pointer-events:none}
.ticks span{position:absolute;top:0;width:3px;height:7px;border-radius:2px;background:var(--muted);transform:translateX(-50%)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(to right,var(--pop) var(--pct,0%),var(--line) var(--pct,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--pop)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.time{font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:center}
.chapters{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--stage);color:var(--ink);border-radius:999px;padding:7px 13px 7px 7px;
  font:700 14px/1 var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card);font-size:12px}
.chip[aria-current="true"]{background:var(--ink);color:var(--stage);border-color:var(--ink)}
.chip[aria-current="true"] b{background:var(--sun);color:var(--tink)}
.hint{color:var(--muted);font-size:14px;margin:12px 6px 0;line-height:1.45}
.rotate{display:none}
@media (max-width:640px) and (orientation:portrait){.rotate{display:block}}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;border:0;padding:12px;background:var(--card)}
.player:fullscreen .stage{width:min(100%,calc((100vh - 200px) * 16 / 9));margin:0 auto}
.player:fullscreen .caption,.player:fullscreen .controls,.player:fullscreen .chapters{width:min(100%,calc((100vh - 200px) * 16 / 9));margin-left:auto;margin-right:auto}
@media (max-width:560px){.time{min-width:0;font-size:13px}.btn{min-width:40px;height:40px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="intro">
    <h1>Lecture 25, animated</h1>
    <p>Counterexamples for CS 341: what one has to do, where to find it, and when it proves nothing.</p>
  </header>
  <section class="player" id="player" aria-label="Animated explainer player">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1600 900" role="img" aria-label="Animation stage. The captions below describe each scene."></svg>
      <button class="poster" id="poster" type="button" aria-label="Play the explainer">
        <span class="poster-len" id="posterLen"></span>
        <span class="poster-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5v15l13-7.5z" fill="currentColor"/></svg></span>
      </button>
    </div>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="controls">
      <button class="btn play" id="play" type="button" aria-label="Play"></button>
      <button class="btn" id="restart" type="button" aria-label="Restart from the beginning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M3.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="scrub"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="100" step="0.1" value="0" aria-label="Seek"></div>
      <span class="time" id="time" aria-live="off">0:00</span>
      <button class="btn" id="speed" type="button" aria-label="Playback speed">1×</button>
      <button class="btn" id="cc" type="button" aria-pressed="true" aria-label="Captions">CC</button>
      <button class="btn" id="fs" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  </section>
  <p class="hint">Space plays or pauses. The left and right arrow keys skip 5 seconds. Tap any chapter to jump there.</p>
  <p class="hint rotate">Turn your phone sideways for a bigger picture.</p>
</main>

    const n=String(Math.max(1,5-Math.floor(tk*5)));if(cnt.textContent!==n)cnt.textContent=n;
    place(timer,{o:Math.min(P(t,.9,1.3),1-P(t,7.6,8.1))});
    place(foot,{o:P(t,14.6,15.2)});
  }};
})());

/* ---------- assemble timeline ---------- */
const root=el('g',{},svg);
const starts=[];let acc=0;
scenes.forEach(s=>{starts.push(acc);s.g=el('g',{},root);s.rows=[];BUILDING=s;s.build(s.g);BUILDING=null;s._lv=-1;s.g.style.display='none';acc+=s.dur;});
const TOTAL=acc;
const chapters=[];scenes.forEach((s,i)=>(s.chapters||[[0,s.title]]).forEach(([o,ti])=>chapters.push({t:starts[i]+o,title:ti})));
const caps=[];scenes.forEach((s,i)=>s.caps.forEach(([o,c])=>caps.push([starts[i]+o,c])));

/* ticket-wipe transition between scenes, carrying the next chapter's title */
const wipe=el('g',{},svg);wipe._x=0;wipe._y=0;
el('path',{d:'M0 0 H2000 L1800 900 H-200Z',fill:'--sun'},wipe);
el('line',{x1:46,y1:0,x2:-154,y2:900,stroke:'--stage','stroke-width':8,'stroke-dasharray':'2 22','stroke-linecap':'round'},wipe);
el('line',{x1:1954,y1:0,x2:1754,y2:900,stroke:'--stage','stroke-width':8,'stroke-dasharray':'2 22','stroke-linecap':'round'},wipe);
const wNum=txt(wipe,900,372,'',{size:34,weight:600,fill:'--tink'});
const wTitle=txt(wipe,900,456,'',{size:92,weight:700,fill:'--tink'});
function renderWipe(t){
  let b=null;for(let i=1;i<starts.length;i++)if(Math.abs(t-starts[i])<.6){b=starts[i];break;}
  if(b===null){place(wipe,{o:0});return;}
  const u=(t-(b-.6))/1.2;
  const ci=chapters.findIndex(c=>Math.abs(c.t-b)<.01);
  if(ci>=0&&wTitle.textContent!==chapters[ci].title){wTitle.textContent=chapters[ci].title;wNum.textContent='Part '+(ci+1)+' of '+chapters.length;}
  if(RM){place(wipe,{dx:-100,o:clamp((.5-Math.abs(u-.5))*4)});return;}
  const tx=u<.4?lerp(1800,0,eout(u/.4)):u<.6?lerp(0,-200,(u-.4)/.2):lerp(-200,-2000,ein((u-.6)/.4));
  place(wipe,{dx:tx,o:1});
}

/* ---------- player ---------- */
const $=id=>document.getElementById(id);
const capEl=$('caption'),playBtn=$('play'),scrub=$('scrub'),timeEl=$('time'),poster=$('poster'),chapNav=$('chapters'),player=$('player');
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
scrub.max=TOTAL;
$('posterLen').textContent=Math.floor(TOTAL/60)+' min '+Math.round(TOTAL%60)+' s';
poster.setAttribute('aria-label','Play the explainer ('+Math.floor(TOTAL/60)+' minutes '+Math.round(TOTAL%60)+' seconds)');
const ICON={play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5v15l12.5-7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.5" fill="currentColor"/></svg>',
  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M3.5 3.5v5h5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const ticksEl=$('ticks');
chapters.forEach((c,i)=>{if(i){const s=document.createElement('span');s.style.left=(c.t/TOTAL*100)+'%';ticksEl.appendChild(s);}
  const b=document.createElement('button');b.type='button';b.className='chip';b.innerHTML='<b>'+(i+1)+'</b>';b.appendChild(document.createTextNode(c.title));
  b.addEventListener('click',()=>{seek(c.t+.01);setPlaying(true);});c.btn=b;chapNav.appendChild(b);});

let T=0,playing=false,started=false,speed=1,last=null,dirty=true,lastScene=-1,lastCap=null,lastChap=-1;
const sceneAt=t=>{let i=0;for(let k=0;k<starts.length;k++)if(t>=starts[k])i=k;return i;};
function render(){
  const t=started?T:6.4;
  const i=sceneAt(Math.min(t,TOTAL-1e-6));
  if(i!==lastScene){scenes.forEach((s,k)=>s.g.style.display=k===i?'':'none');lastScene=i;}
  if(scenes[i]._lv!==FONTV){scenes[i].rows.forEach(layoutRow);scenes[i]._lv=FONTV;}
  scenes[i].update(t-starts[i]);
  renderWipe(t);
  let c='';if(started){for(const [ct,s] of caps){if(ct<=T)c=s;else break;}}
  if(c!==lastCap){capEl.textContent=c;lastCap=c;}
  scrub.value=T;scrub.style.setProperty('--pct',(T/TOTAL*100).toFixed(2)+'%');
  timeEl.textContent=fmt(T)+' / '+fmt(TOTAL);
  let ch=0;chapters.forEach((cc,k)=>{if(T>=cc.t-.001)ch=k;});
  if(ch!==lastChap){chapters.forEach((cc,k)=>cc.btn.setAttribute('aria-current',k===ch?'true':'false'));
    if(started){const b=chapters[ch].btn;chapNav.scrollTo({left:b.offsetLeft-chapNav.clientWidth/2+b.offsetWidth/2,behavior:RM?'auto':'smooth'});}lastChap=ch;}
}
function setPlaying(p){
  if(p&&T>=TOTAL-.01)T=0;
  playing=p;last=null;
  if(p){started=true;poster.hidden=true;}
  const ended=!p&&T>=TOTAL-.01;
  playBtn.innerHTML=p?ICON.pause:(ended?ICON.replay:ICON.play);
  playBtn.setAttribute('aria-label',p?'Pause':(ended?'Replay':'Play'));
  dirty=true;
}
function seek(t){started=true;poster.hidden=true;T=clamp(t,0,TOTAL);dirty=true;}
function loop(now){
  if(playing){if(last!==null)T+=Math.min((now-last)/1000,.1)*speed;last=now;if(T>=TOTAL){T=TOTAL;setPlaying(false);}dirty=true;}
  if(dirty){render();dirty=false;}
  requestAnimationFrame(loop);
}
playBtn.addEventListener('click',()=>setPlaying(!playing));
poster.addEventListener('click',()=>{T=0;setPlaying(true);playBtn.focus({preventScroll:true});});
$('restart').addEventListener('click',()=>{seek(0);setPlaying(true);});
scrub.addEventListener('input',()=>seek(parseFloat(scrub.value)));
const speeds=[1,1.25,1.5,.75];
$('speed').addEventListener('click',e=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];e.currentTarget.textContent=speed+'×';e.currentTarget.setAttribute('aria-label','Playback speed '+speed+' times');});
$('cc').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);capEl.hidden=!on;});
const fsBtn=$('fs');
if(!(document.fullscreenEnabled&&player.requestFullscreen))fsBtn.hidden=true;
fsBtn.addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else player.requestFullscreen().catch(()=>{});}catch(e){}});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key===' '||e.key==='k'){if(tag==='button'&&e.key===' ')return;if(tag==='input'&&e.key===' '){e.preventDefault();setPlaying(!playing);return;}
    if(tag!=='input'){e.preventDefault();setPlaying(!playing);}}
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&tag!=='input'){e.preventDefault();seek(T+(e.key==='ArrowRight'?5:-5));}
});
setPlaying(false);
if(document.fonts){if(document.fonts.ready)document.fonts.ready.then(()=>{FONTV++;dirty=true;});document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{FONTV++;dirty=true;});}
window.__seek=t=>{seek(t);render();};
window.__total=TOTAL;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
